<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>

    <!-- Scripts Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --violet: #2d1048;
            --violet-light: #4a1a6b;
            --violet-hover: #5d1f8a;
            --gold: #f5a623;
            --gold-light: #ffd700;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #666;
            --text-dark: #111827;
            --success: #27ae60;
            --danger: #e74c3c;
            --info: #3498db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--gray-light); 
            color: var(--text-dark);
            overflow-x: hidden; 
        }

        /* ==================== NAVBAR ==================== */
        .navbar {
            background: linear-gradient(135deg, var(--violet), #4a1a6b);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-logo img { height: 72px; }

        .nav-logo span {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ffd700;
            margin-left: 14px;
            letter-spacing: 0.5px;
        }

        .nav-menu { display: flex; align-items: center; gap: 5px; }

        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--gold-light);
            background: rgba(255,255,255,0.1);
        }

        .user-info {
            color: var(--gold-light);
            font-size: 0.85rem;
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            margin-left: 10px;
            font-weight: 600;
        }

        .btn-nav {
            padding: 8px 20px !important;
            border-radius: 50px !important;
            font-weight: bold !important;
            text-transform: uppercase;
            font-size: 0.85rem !important;
            margin-left: 8px;
        }

        .btn-connexion { border: 2px solid var(--white) !important; }
        .btn-connexion:hover { background: white; color: var(--violet) !important; }
        .btn-logout { background: var(--danger) !important; color: white !important; }

        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
        .hamburger span { width: 28px; height: 3px; background: var(--gold); border-radius: 2px; }

        /* ==================== PAGES SYSTEM ==================== */
        .page { display: none; }
        .page.active { display: block; }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            padding: 40px 40px 0;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header h2 { 
            color: var(--violet); 
            font-size: 2.2rem; 
            font-weight: 800;
            border-bottom: 4px solid var(--gold);
            padding-bottom: 5px;
        }

        .page-content { padding: 0 40px 60px; max-width: 1400px; margin: 0 auto; }

        /* ==================== HERO ==================== */
        .hero {
            background: linear-gradient(135deg, var(--violet), #4a1a6b);
            color: white;
            min-height: 85vh;
            display: flex;
            align-items: center;
            padding: 40px 4%;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 380px 1fr 520px;
            gap: 35px;
            max-width: 1850px;
            width: 100%;
            margin: 0 auto;
            align-items: center;
        }

        .logo {
            width: 100%;
            max-width: 340px;
            transform: scale(1.18);
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.7));
            transition: 0.3s;
        }

        .hero h1 { font-size: 3.6rem; line-height: 1.1; margin-bottom: 15px; font-weight: 800; }
        .subtitle { color: #ffd700; font-size: 1.8rem; margin-bottom: 35px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            margin: 8px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }

        .btn-gold { background: var(--gold); color: var(--violet); }
        .btn-gold:hover { background: #ffbb33; transform: translateY(-3px); }

        .next-match {
            background: linear-gradient(90deg, var(--gold), #ffbb33);
            color: #2d1048;
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 30px;
            display: inline-block;
        }

        .team-photo {
            width: 100%;
            max-width: 500px;
            border: 6px solid var(--gold);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* ==================== EFFECTIF & MODALES ==================== */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .player-card {
            background: var(--white);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.06);
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }

        .player-card:hover { transform: translateY(-8px); border-color: var(--gold); }

        .player-number {
            position: absolute; top: 15px; right: 15px; background: var(--gold);
            color: var(--violet); width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
        }

        .player-photo {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            margin: 0 auto 15px; display: block; border: 4px solid var(--gold);
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--white); border-radius: 24px; padding: 40px; max-width: 600px; width: 100%;
            position: relative; animation: modalPop 0.3s ease-out; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-close-btn {
            position: absolute; top: 20px; right: 20px; width: 36px; height: 36px;
            border-radius: 50%; border: none; background: #f0f0f0; color: var(--violet);
            font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .modal-close-btn:hover { background: var(--danger); color: white; }

        .player-tabs-btn {
            background: none; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer;
            color: var(--gray-dark); border-bottom: 3px solid transparent; transition: 0.3s;
        }
        .player-tabs-btn.active { color: var(--violet); border-bottom-color: var(--violet); }

        .modal-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .m-stat-card {
            background: linear-gradient(135deg, var(--violet), var(--violet-light));
            padding: 15px; border-radius: 16px; text-align: center; color: white;
        }
        .m-stat-card .val { font-size: 1.8rem; font-weight: 900; color: var(--gold); display: block; }
        .m-stat-card .lab { font-size: 0.7rem; text-transform: uppercase; opacity: 0.8; }

        /* Protection Admin */
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }
        .toast { position: fixed; bottom: 30px; right: 30px; padding: 16px 28px; border-radius: 50px; color: white; font-weight: 700; z-index: 5000; transform: translateY(100px); opacity: 0; transition: 0.4s; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        @media (max-width: 990px) {
            .hamburger { display: flex; }
            .nav-menu { display: none; position: absolute; top: 100px; left: 0; right: 0; background: var(--violet); flex-direction: column; padding: 20px; }
            .nav-menu.open { display: flex; }
        }
    </style>
</head>
<body class="">

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-menu" id="navLinks">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Calendrier</a>
            <a onclick="showPage('resultats')" id="nav-resultats">Résultats</a>
            <a onclick="showPage('classement')" id="nav-classement">Classement</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Effectif</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('infos')" id="nav-infos">Infos</a>
            <a onclick="showPage('messagerie')" id="nav-messagerie">Messagerie</a>
            <span class="user-info" id="userInfo" style="display:none"></span>
            <a class="btn btn-nav btn-connexion" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn btn-nav btn-logout" onclick="doLogout()" id="btnLogout" style="display:none">Déconnexion</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <section class="hero">
            <div class="hero-content">
                <div><img src="logo-alcf.png" class="logo"></div>
                <div style="text-align:center">
                    <h1>ALCF PNM BASKET</h1>
                    <p class="subtitle">Espace officiel de l'équipe</p>
                    <div class="next-match">🔴 Prochain match : <span id="nextMatchText">Chargement...</span></div>
                </div>
                <div><img src="equipe-2025-2026.png" class="team-photo"></div>
            </div>
        </section>
    </div>

    <!-- CALENDRIER -->
    <div id="page-calendrier" class="page">
        <div class="page-header"><h2>📅 Calendrier</h2><button class="btn btn-gold admin-only" onclick="openModal('match')">+ Match</button></div>
        <div class="page-content"><table class="data-table" style="width:100%"><tbody id="calendrierBody"></tbody></table></div>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page">
        <div class="page-header"><h2>👥 Effectif PNM</h2><button class="btn btn-gold admin-only" onclick="openModal('joueur')">+ Joueur</button></div>
        <div class="page-content"><div class="players-grid" id="effectifGrid"></div></div>
    </div>

    <!-- MODAL DETAILS JOUEUR (CORRIGÉE) -->
    <div class="modal-overlay" id="modal-player-details">
        <div class="modal">
            <button class="modal-close-btn" onclick="closeModal('player-details')">×</button>
            
            <div style="display: flex; align-items: center; gap: 20px; border-bottom: 2px solid var(--gray); padding-bottom: 20px; margin-bottom: 20px;">
                <img id="detailPlayerPhoto" class="player-photo" style="margin:0; width:100px; height:100px;" src="">
                <div style="text-align:left">
                    <h3 id="detailPlayerName" style="color:var(--violet); font-size:1.6rem;">-</h3>
                    <p id="detailPlayerPoste" style="color:var(--gold); font-weight:bold;"></p>
                    <p id="detailPlayerNumero" style="font-weight:bold; color:var(--violet-light)"></p>
                </div>
            </div>

            <div style="display:flex; justify-content:space-around; margin-bottom:20px; border-bottom:2px solid var(--gray)">
                <button class="player-tabs-btn active" id="tab-btn-infos" onclick="switchPlayerTab('infos')">🪪 Informations</button>
                <button class="player-tabs-btn" id="tab-btn-stats" onclick="switchPlayerTab('stats')">📈 Statistiques</button>
            </div>

            <div id="player-tab-infos"></div>
            <div id="player-tab-stats" style="display:none"></div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="page-login" class="page">
        <div style="max-width:400px; margin:50px auto; background:white; padding:40px; border-radius:20px; text-align:center;">
            <h2>Connexion</h2>
            <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:10px; margin:10px 0;">
            <input type="password" id="loginPassword" placeholder="Pass" style="width:100%; padding:10px; margin:10px 0;">
            <button class="btn btn-gold" onclick="doLogin()" style="width:100%">Se connecter</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ADMIN_EMAILS = ["polocezar@gmail.com"];
        let currentUser = null, isAdmin = false;

        auth.onAuthStateChanged(user => {
            currentUser = user;
            isAdmin = user && ADMIN_EMAILS.includes(user.email.toLowerCase());
            document.body.classList.toggle('is-admin', isAdmin);
            if(user) {
                document.getElementById('userInfo').style.display = 'inline';
                document.getElementById('userInfo').textContent = '👤 ' + user.email.split('@')[0];
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'inline-flex';
            }
        });

        async function doLogin() {
            try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); showPage('accueil'); }
            catch { alert('Erreur'); }
        }
        function doLogout() { auth.signOut(); location.reload(); }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            loadData(id);
        }

        function loadData(id) {
            if(id==='effectif') loadEffectif();
        }

        function loadEffectif() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => {
                    const j = doc.data();
                    return `<div class="player-card" onclick="openPlayerDetails('${doc.id}')">
                        <div class="player-number">${j.numero}</div>
                        <img src="${j.photo || 'logo-alcf.png'}" class="player-photo">
                        <h4>${j.prenom} ${j.nom}</h4>
                        <div class="position">${j.poste}</div>
                        <p style="font-size:0.7rem; font-weight:bold; color:var(--violet); margin-top:10px;">🔍 CLIQUEZ POUR LES DÉTAILS</p>
                    </div>`;
                }).join('');
            });
        }

        async function openPlayerDetails(id) {
            const doc = await db.collection('joueurs').doc(id).get();
            const j = doc.data();
            const age = calculateAge(j.dateNaissance);

            document.getElementById('detailPlayerName').textContent = j.prenom + ' ' + j.nom;
            document.getElementById('detailPlayerPoste').textContent = j.poste;
            document.getElementById('detailPlayerNumero').textContent = 'Maillot n° ' + j.numero;
            document.getElementById('detailPlayerPhoto').src = j.photo || 'logo-alcf.png';

            // INFOS - Correction bug "null" et suppression doublon Fermer
            const showPrivate = isAdmin;
            document.getElementById('player-tab-infos').innerHTML = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; background:var(--gray-light); padding:20px; border-radius:15px; text-align:left;">
                    <div><small style="color:var(--gray-dark); font-weight:bold">NAISSANCE</small><p><strong>${j.dateNaissance ? formatDate(j.dateNaissance) : '-'} (${age} ans)</strong></p></div>
                    <div><small style="color:var(--gray-dark); font-weight:bold">TAILLE</small><p><strong>${j.taille ? j.taille + ' cm' : '-'}</strong></p></div>
                    <div><small style="color:var(--gray-dark); font-weight:bold">LICENCE</small><p><strong>${showPrivate ? (j.licence || 'N/A') : '••••••'}</strong></p></div>
                    <div><small style="color:var(--gray-dark); font-weight:bold">TÉLÉPHONE</small><p><strong>${showPrivate ? (j.telephone ? `<a href="tel:${j.telephone}">${j.telephone}</a>` : 'Non renseigné') : '••••••'}</strong></p></div>
                    <div style="grid-column: span 2;"><small style="color:var(--gray-dark); font-weight:bold">EMAIL</small><p><strong>${showPrivate ? (j.email ? `<a href="mailto:${j.email}">${j.email}</a>` : 'Non renseigné') : '••••••'}</strong></p></div>
                </div>`;

            // STATS
            const sSnap = await db.collection('statsIndiv').where('joueurNom', '==', j.prenom + ' ' + j.nom).get();
            if(!sSnap.empty) {
                const s = sSnap.docs[0].data();
                document.getElementById('player-tab-stats').innerHTML = `
                    <div class="modal-stats-grid">
                        <div class="m-stat-card"><span class="val">${s.totalPts}</span><span class="lab">Points</span></div>
                        <div class="m-stat-card"><span class="val">${s.matchs > 0 ? (s.totalPts/s.matchs).toFixed(1) : 0}</span><span class="lab">Moyenne</span></div>
                        <div class="m-stat-card"><span class="val">${s.matchs}</span><span class="lab">Matchs</span></div>
                        <div class="m-stat-card"><span class="val">${s.tempsJeu||0}</span><span class="lab">Minutes</span></div>
                    </div>`;
            } else {
                document.getElementById('player-tab-stats').innerHTML = '<p style="text-align:center; padding:20px;">Aucune donnée.</p>';
            }

            switchPlayerTab('infos');
            document.getElementById('modal-player-details').classList.add('active');
        }

        function switchPlayerTab(tab) {
            const isInfos = tab === 'infos';
            document.getElementById('tab-btn-infos').classList.toggle('active', isInfos);
            document.getElementById('tab-btn-stats').classList.toggle('active', !isInfos);
            document.getElementById('player-tab-infos').style.display = isInfos ? 'block' : 'none';
            document.getElementById('player-tab-stats').style.display = !isInfos ? 'block' : 'none';
        }

        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); }

        function formatDate(s) { return new Date(s).toLocaleDateString('fr-FR'); }
        function calculateAge(s) {
            if(!s) return '-';
            const b = new Date(s), t = new Date();
            let a = t.getFullYear() - b.getFullYear();
            if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
            return a;
        }

        showPage('accueil');
    </script>
</body>
</html>
