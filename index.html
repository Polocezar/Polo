<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; overflow-x: hidden; }

        /* NAVBAR */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 72px; }
        .nav-logo span { font-size: 2.2rem; font-weight: 800; color: #ffd700; margin-left: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold-light); background: rgba(255,255,255,0.1); }
        .user-info { color: var(--gold-light); margin: 0 15px; font-weight: bold; }

        /* GESTION DES PAGES */
        .page { display: none; width: 100%; min-height: 90vh; }
        .page.active { display: block !important; }
        #page-accueil { background: var(--violet); }

        /* DESIGN EFFECTIF (FOND TERRAIN) */
        #page-effectif { 
            background-image: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8)), url('https://www.transparenttextures.com/patterns/wood-pattern.png'); 
            background-color: #d2b48c; /* Couleur bois parquet */
        }

        /* CARTE STYLE PANINI */
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; padding: 20px; }
        .player-card { 
            background: white; 
            border: 8px solid white; 
            border-radius: 15px; 
            padding: 0; 
            text-align: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); 
            position: relative; 
            cursor: pointer; 
            transition: 0.4s; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .player-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 2px solid var(--gold); border-radius: 10px; pointer-events: none; z-index: 2;
        }
        .player-card:hover { transform: scale(1.05) rotate(1deg); box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        
        .player-img-container { width: 100%; height: 280px; overflow: hidden; background: #eee; position: relative; }
        .player-img { width: 100%; height: 100%; object-fit: cover; object-position: center 10%; transition: 0.5s; }
        
        .player-info-banner { 
            background: var(--violet); color: white; padding: 15px 10px; 
            border-top: 4px solid var(--gold); position: relative; z-index: 3;
        }
        .player-card h4 { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; color: var(--gold-light); }
        .player-card .poste-label { font-size: 0.8rem; font-weight: bold; opacity: 0.9; }

        .player-num-panini { 
            position: absolute; top: 10px; left: 10px; background: var(--gold); 
            color: var(--violet); width: 45px; height: 45px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.2rem; border: 3px solid white; z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* CHAMPIONNAT & CALENDRIER */
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
        .iframe-container-wrapper { position: relative; width: 100%; height: 800px; border-radius: 15px; overflow: hidden; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #ffbbIframe { position: absolute; top: -260px; left: -10px; width: 120%; height: 1200px; border: none; }
        
        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 24px; padding: 40px; max-width: 600px; width: 100%; position: relative; animation: modalPop 0.3s ease-out; }
        @keyframes modalPop { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; border: none; background: #eee; cursor: pointer; font-size: 20px; font-weight: bold; color: var(--violet); }

        .btn { padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="nav-menu">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Calendrier</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Championnat</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Effectif</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('galerie')" id="nav-galerie">Galerie</a>
            <a onclick="showPage('infos')" id="nav-infos">Infos</a>
            <span class="user-info" id="userInfo" style="display:none"></span>
            <a class="btn btn-gold" style="padding:8px 15px; font-size:0.8rem;" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn" style="padding:8px 15px; font-size:0.8rem; background:var(--danger); color:white; display:none;" onclick="doLogout()" id="btnLogout">Sortir</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <div style="background: var(--violet); color: white; padding: 80px 5%; display: flex; align-items: center; justify-content: center; min-height: 85vh;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 50px; max-width: 1200px; align-items: center;">
                <div style="text-align: center;">
                    <img src="logo-alcf.png" style="width: 100%; max-width: 320px; filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));">
                    <h1 style="font-size: 3.5rem; margin-top: 20px;">LES VIOLETS</h1>
                    <div style="margin-top:30px;">
                        <button onclick="showPage('effectif')" class="btn" style="border:2px solid var(--gold); color:white; background:transparent; margin-right:10px;">L'EFFECTIF</button>
                        <button onclick="showPage('championnat')" class="btn btn-gold">CHAMPIONNAT</button>
                    </div>
                </div>
                <img src="equipe-2025-2026.png" style="width: 100%; border: 6px solid var(--gold); border-radius: 20px;">
            </div>
        </div>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page">
        <div class="container">
            <div class="page-header" style="background: rgba(255,255,255,0.9); padding: 20px; border-radius: 15px;">
                <h2 style="margin:0;">👥 L'Effectif PNM 2025/2026</h2>
                <button class="btn btn-gold admin-only" onclick="openModal('joueur')">+ Ajouter un joueur</button>
            </div>
            <div class="players-grid" id="effectifGrid">
                <!-- Les cartes Panini seront générées ici -->
            </div>
        </div>
    </div>

    <!-- CHAMPIONNAT -->
    <div id="page-championnat" class="page">
        <div class="container" style="max-width: 100%;">
            <iframe id="ffbbIframe" style="width:100%; height:900px; border:none; border-radius:20px;" src="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=1"></iframe>
        </div>
    </div>

    <!-- CALENDRIER -->
    <div id="page-calendrier" class="page">
        <div class="container"><h2>📅 Calendrier de l'équipe</h2><div id="calendarGrid" style="background:white; padding:20px; border-radius:20px;">Chargement...</div></div>
    </div>

    <!-- LOGIN -->
    <div id="page-login" class="page">
        <div class="container" style="max-width:400px; margin:auto;"><div style="background:white; padding:40px; border-radius:20px; text-align:center;"><h2>Connexion</h2><input type="email" id="loginEmail" style="width:100%; padding:10px; margin:10px 0;"><input type="password" id="loginPassword" style="width:100%; padding:10px; margin:10px 0;"><button class="btn btn-gold" onclick="doLogin()">OK</button></div></div>
    </div>

    <!-- MODALE DETAILS JOUEUR -->
    <div class="modal-overlay" id="modal-player-details">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('player-details')">×</button>
            <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
                <img id="detPhoto" class="player-img" style="margin:0; width:120px; height:120px; border-radius:50%; border:4px solid var(--gold); object-fit:cover;">
                <div style="text-align:left;">
                    <h3 id="detName" style="color:var(--violet); font-size:1.8rem; text-transform:uppercase;">-</h3>
                    <p id="detPoste" style="color:var(--gold); font-weight:bold;"></p>
                    <p id="detNum" style="font-weight:bold; color:var(--violet-light)"></p>
                </div>
            </div>
            <div id="tabInfos" style="background:var(--gray-light); padding:20px; border-radius:15px; text-align:left;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false;

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('userInfo').style.display='inline';
                document.getElementById('userInfo').textContent = '👤 ' + u.email.split('@')[0];
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
                if(document.getElementById('page-login').classList.contains('active')) showPage('accueil');
            }
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-'+id);
            if (target) target.classList.add('active');
            if(id==='effectif') loadEff();
            window.scrollTo(0,0);
        }

        // CHARGEMENT EFFECTIF STYLE PANINI
        function loadEff() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => {
                    const j = doc.data();
                    return `
                    <div class="player-card" onclick="openPlayerDetails('${doc.id}')">
                        <div class="player-num-panini">${j.numero || '0'}</div>
                        <div class="player-img-container">
                            <img src="${j.photo || 'logo-alcf.png'}" class="player-img">
                        </div>
                        <div class="player-info-banner">
                            <h4>${j.prenom} ${j.nom}</h4>
                            <span class="poste-label">${j.poste}</span>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        async function openPlayerDetails(id) {
            const doc = await db.collection('joueurs').doc(id).get();
            const j = doc.data();
            
            document.getElementById('detPhoto').src = j.photo || 'logo-alcf.png';
            document.getElementById('detName').textContent = j.prenom + ' ' + j.nom;
            document.getElementById('detPoste').textContent = j.poste;
            document.getElementById('detNum').textContent = 'Maillot n° ' + (j.numero || '0');
            
            document.getElementById('tabInfos').innerHTML = `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <div><small>TAILLE</small><p><strong>${j.taille || '-'} cm</strong></p></div>
                    <div><small>NAISSANCE</small><p><strong>${j.dateNaissance || '-'}</strong></p></div>
                    <div style="grid-column: span 2; border-top:1px solid var(--gray); padding-top:10px; margin-top:5px;">
                        <small>LICENCE</small><p><strong>${isAdmin ? (j.licence || '-') : '••••••'}</strong></p>
                    </div>
                </div>`;
            
            openModal('player-details');
        }

        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); }
        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        showPage('accueil');
    </script>
</body>
</html>
