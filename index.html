<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; overflow-x: hidden; }

        /* NAVBAR */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 72px; }
        .nav-logo span { font-size: 2.2rem; font-weight: 800; color: #ffd700; margin-left: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold-light); background: rgba(255,255,255,0.1); }
        .user-info { color: var(--gold-light); margin: 0 15px; font-weight: bold; }

        /* PAGES */
        .page { display: none; width: 100%; min-height: 90vh; }
        .page.active { display: block !important; }

        /* ACCUEIL */
        .hero { background: linear-gradient(135deg, var(--violet), #4a1a6b); color: white; padding: 60px 4%; min-height: 85vh; display: flex; align-items: center; }
        .hero-content { display: grid; grid-template-columns: 350px 1fr 500px; gap: 40px; max-width: 1700px; margin: 0 auto; align-items: center; width: 100%; }
        .hero-logo { width: 100%; max-width: 320px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6)); }
        .hero-text { text-align: center; }
        .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; font-weight: 900; }
        .hero-btns { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .hero-team-img { width: 100%; max-width: 500px; border: 6px solid var(--gold); border-radius: 20px; }

        /* EFFECTIF FOND TERRAIN */
        #page-effectif { 
            background: #d2b48c url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-attachment: fixed;
        }

        /* CARTE PANINI */
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 30px; padding: 20px; }
        .player-card { 
            background: white; border: 6px solid white; border-radius: 12px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); position: relative; cursor: pointer; 
            transition: 0.3s; overflow: hidden; border-bottom: 25px solid white;
        }
        .player-card:hover { transform: scale(1.03); z-index: 10; }
        .player-img-container { width: 100%; height: 300px; overflow: hidden; border: 2px solid var(--gold); border-radius: 6px; }
        .player-img { width: 100%; height: 100%; object-fit: cover; object-position: center 10%; }
        .player-num-panini { position: absolute; top: 12px; left: 12px; background: var(--gold); color: var(--violet); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid white; z-index: 5; }
        .player-info-banner { background: var(--violet); color: var(--gold-light); padding: 10px; margin-top: -2px; }
        .player-info-banner h4 { font-size: 1.1rem; text-transform: uppercase; margin: 0; }
        .player-info-banner p { color: white; font-size: 0.8rem; font-weight: bold; margin: 0; }

        /* ADMIN ACTIONS SUR CARTES */
        .admin-card-actions { position: absolute; bottom: 45px; right: 10px; display: flex; gap: 5px; z-index: 20; }
        .btn-mini { padding: 5px 8px; border-radius: 5px; border: none; cursor: pointer; color: white; font-size: 0.8rem; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 20px; padding: 30px; max-width: 500px; width: 100%; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 15px; border: none; background: #eee; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--violet); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }

        .btn { padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="nav-menu">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Calendrier</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Championnat</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Effectif</a>
            <span class="user-info" id="userInfo" style="display:none"></span>
            <a class="btn btn-gold" style="padding:8px 15px; font-size:0.7rem;" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn" style="padding:8px 15px; font-size:0.7rem; background:var(--danger); color:white; display:none;" onclick="doLogout()" id="btnLogout">Sortir</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <section class="hero">
            <div class="hero-content">
                <img src="logo-alcf.png" class="hero-logo">
                <div class="hero-text">
                    <h1>BIENVENUE CHEZ<br>LES VIOLETS</h1>
                    <div class="hero-btns">
                        <button onclick="showPage('effectif')" class="btn" style="background:transparent; border:2px solid var(--gold); color:white;">L'EFFECTIF</button>
                        <button onclick="showPage('championnat')" class="btn btn-gold">CHAMPIONNAT</button>
                    </div>
                </div>
                <img src="equipe-2025-2026.png" class="hero-team-img">
            </div>
        </section>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page">
        <div class="container">
            <div class="page-header" style="background:rgba(255,255,255,0.9); padding:20px; border-radius:15px;">
                <h2>👥 Effectif PNM</h2>
                <button class="btn btn-gold admin-only" onclick="openModal('joueur')">+ Joueur</button>
            </div>
            <div class="players-grid" id="effectifGrid"></div>
        </div>
    </div>

    <!-- CHAMPIONNAT -->
    <div id="page-championnat" class="page">
        <div class="container" style="max-width:100%">
            <iframe style="width:100%; height:800px; border:none; border-radius:15px;" src="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=1"></iframe>
        </div>
    </div>

    <!-- CALENDRIER / LOGIN (Stubs) -->
    <div id="page-calendrier" class="page"><div class="container"><h2>Calendrier</h2></div></div>
    <div id="page-login" class="page"><div class="container" style="max-width:400px;margin:auto;"><div style="background:white;padding:40px;border-radius:20px;text-align:center;"><h2>Connexion</h2><input type="email" id="loginEmail" style="width:100%;margin:10px 0;padding:10px;"><input type="password" id="loginPassword" style="width:100%;margin:10px 0;padding:10px;"><button class="btn btn-gold" onclick="doLogin()">OK</button></div></div></div>

    <!-- MODALE JOUEUR -->
    <div class="modal-overlay" id="modal-joueur">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('joueur')">×</button>
            <h3>Fiche Joueur</h3>
            <input type="hidden" id="joueurId">
            <div class="form-group"><label>Prénom</label><input type="text" id="joueurPrenom"></div>
            <div class="form-group"><label>Nom</label><input type="text" id="joueurNom"></div>
            <div class="form-group"><label>N° Maillot</label><input type="number" id="joueurNumero"></div>
            <div class="form-group"><label>Poste</label><select id="joueurPoste"><option value="Meneur">Meneur</option><option value="Arrière">Arrière</option><option value="Ailier">Ailier</option><option value="Ailier Fort">Ailier Fort</option><option value="Pivot">Pivot</option></select></div>
            <div class="form-group"><label>Photo URL</label><input type="text" id="joueurPhoto"></div>
            <button class="btn btn-gold" style="width:100%" onclick="saveJoueur()">Enregistrer</button>
        </div>
    </div>

    <!-- MODALE DETAILS -->
    <div class="modal-overlay" id="modal-player-details">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('player-details')">×</button>
            <div style="display:flex; align-items:center; gap:20px;">
                <img id="detPhoto" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--gold);">
                <div style="text-align:left">
                    <h3 id="detName" style="margin:0"></h3>
                    <p id="detPoste" style="color:var(--gold); font-weight:bold;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false;

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('userInfo').style.display='inline';
                document.getElementById('userInfo').textContent = '👤 ' + u.email.split('@')[0];
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
                if(document.getElementById('page-login').classList.contains('active')) showPage('accueil');
            }
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            if(id==='effectif') loadEff();
        }

        function loadEff() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => {
                    const j = doc.data();
                    return `
                    <div class="player-card" onclick="openPlayer('${doc.id}')">
                        <div class="player-num-panini">${j.numero || '0'}</div>
                        <div class="player-img-container"><img src="${j.photo || 'logo-alcf.png'}" class="player-img"></div>
                        <div class="player-info-banner">
                            <h4>${j.prenom} ${j.nom}</h4>
                            <p>${j.poste}</p>
                        </div>
                        <div class="admin-card-actions admin-only">
                            <button class="btn-mini" style="background:var(--gold)" onclick="event.stopPropagation(); editJoueur('${doc.id}')">✏️</button>
                            <button class="btn-mini" style="background:var(--danger)" onclick="event.stopPropagation(); deleteDoc('joueurs','${doc.id}')">🗑️</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        async function openPlayer(id) {
            const d = (await db.collection('joueurs').doc(id).get()).data();
            document.getElementById('detPhoto').src = d.photo || 'logo-alcf.png';
            document.getElementById('detName').textContent = d.prenom + ' ' + d.nom;
            document.getElementById('detPoste').textContent = d.poste;
            openModal('player-details');
        }

        async function editJoueur(id) {
            const d = (await db.collection('joueurs').doc(id).get()).data();
            document.getElementById('joueurId').value = id;
            document.getElementById('joueurPrenom').value = d.prenom;
            document.getElementById('joueurNom').value = d.nom;
            document.getElementById('joueurNumero').value = d.numero;
            document.getElementById('joueurPoste').value = d.poste;
            document.getElementById('joueurPhoto').value = d.photo;
            openModal('joueur');
        }

        async function saveJoueur() {
            const id = document.getElementById('joueurId').value, data = { prenom: document.getElementById('joueurPrenom').value, nom: document.getElementById('joueurNom').value, numero: parseInt(document.getElementById('joueurNumero').value)||0, poste: document.getElementById('joueurPoste').value, photo: document.getElementById('joueurPhoto').value };
            if(id) await db.collection('joueurs').doc(id).update(data); else await db.collection('joueurs').add(data);
            closeModal('joueur');
        }

        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); if(id==='joueur') document.getElementById('joueurId').value=''; }
        async function deleteDoc(c,i) { if(confirm('Supprimer?')) await db.collection(c).doc(i).delete(); }
        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        showPage('accueil');
    </script>
</body>
</html>
