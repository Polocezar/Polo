
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALCF Basket</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; overflow-x: hidden; width: 100%; }

        /* NAVBAR ADAPTATIVE */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 50px; }
        .nav-logo span { font-size: 1.4rem; font-weight: 800; color: #ffd700; margin-left: 10px; }
        
        .nav-menu { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 6px 10px; font-weight: 600; border-radius: 6px; font-size: 0.8rem; white-space: nowrap; }
        .nav-menu a.active { background: rgba(255,255,255,0.1); color: var(--gold); }

        /* HERO ACCUEIL RESPONSIVE */
        .hero { background: var(--violet); color: white; padding: 40px 20px; min-height: 80vh; display: flex; align-items: center; }
        .hero-content { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; gap: 30px; }
        .hero-logo { width: 180px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        .hero h1 { font-size: 2.2rem; line-height: 1.2; font-weight: 900; }
        .hero-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .hero-team-img { width: 100%; max-width: 500px; border: 4px solid var(--gold); border-radius: 15px; }

        /* PAGES & CONTAINERS */
        .page { display: none; width: 100%; min-height: 90vh; }
        .page.active { display: block; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 20px 15px; }
        .page-header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 12px; }

        /* CHAMPIONNAT (MOBILE FRIENDLY) */
        .iframe-wrapper { position: relative; width: 100%; height: 600px; border-radius: 12px; overflow: hidden; background: white; }
        #ffbbIframe { position: absolute; top: -330px; left: -10%; width: 120%; height: 1000px; border: none; }

        /* EFFECTIF STYLE PANINI RESPONSIVE */
        #page-effectif { background: #d2b48c url('https://www.transparenttextures.com/patterns/wood-pattern.png'); }
        .players-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* 2 par ligne sur mobile */
            gap: 15px; 
            padding: 10px; 
        }
        @media (min-width: 768px) { .players-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .players-grid { grid-template-columns: repeat(5, 1fr); } }

        .player-card { 
            background: white; border: 4px solid white; border-radius: 10px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative; overflow: hidden; 
            border-bottom: 15px solid white;
        }
        .player-img-container { width: 100%; height: 180px; overflow: hidden; border: 1px solid var(--gold); }
        @media (min-width: 768px) { .player-img-container { height: 250px; } }
        .player-img { width: 100%; height: 100%; object-fit: cover; object-position: center 10%; }
        .player-num-panini { position: absolute; top: 5px; left: 5px; background: var(--gold); color: var(--violet); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.9rem; border: 2px solid white; z-index: 5; }
        .player-info-banner { background: var(--violet); color: var(--gold-light); padding: 5px; text-align: center; }
        .player-info-banner h4 { font-size: 0.8rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* BOUTONS & MODALES */
        .btn { padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; font-size: 0.8rem; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 10px; }
        .modal { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; position: relative; max-height: 90vh; overflow-y: auto; }
        
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }

        /* CALENDRIER MOBILE */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--gray); gap: 1px; font-size: 0.7rem; }
        .calendar-day { background: white; min-height: 60px; padding: 4px; }
        .calendar-day-head { background: var(--violet); color: white; padding: 5px; text-align: center; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF</span>
        </a>
        <div class="nav-menu">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Cal.</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Champ.</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Equipe</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('galerie')" id="nav-galerie">Photos</a>
            <a onclick="showPage('login')" id="btnLogin">🔒</a>
            <a class="btn" style="background:var(--danger); color:white; display:none; padding:5px 10px;" onclick="doLogout()" id="btnLogout">X</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <section class="hero">
            <div class="hero-content">
                <img src="logo-alcf.png" class="hero-logo">
                <h1>ALCF BASKET PNM</h1>
                <div class="hero-btns">
                    <button onclick="showPage('effectif')" class="btn btn-gold">L'EFFECTIF</button>
                    <button onclick="showPage('championnat')" class="btn btn-outline">CLASSEMENT</button>
                </div>
                <img src="equipe-2025-2026.png" class="hero-team-img">
            </div>
        </section>
    </div>

    <!-- CHAMPIONNAT -->
    <div id="page-championnat" class="page">
        <div class="container">
            <div class="iframe-wrapper">
                <iframe id="ffbbIframe" src="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=1"></iframe>
            </div>
        </div>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page">
        <div class="container">
            <div class="page-header">
                <h2>👥 Effectif PNM</h2>
                <button class="btn btn-gold admin-only" onclick="openModal('joueur')">+ JOUEUR</button>
            </div>
            <div class="players-grid" id="effectifGrid"></div>
        </div>
    </div>

    <!-- CALENDRIER -->
    <div id="page-calendrier" class="page">
        <div class="container">
            <div class="page-header"><h2>📅 Calendrier</h2></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="page-stats" class="page">
        <div class="container">
            <div class="page-header"><h2>📈 Stats</h2><button class="btn btn-gold admin-only" onclick="openModal('statsIndiv')">+</button></div>
            <div id="statsIndivBody" style="background:white; border-radius:10px; padding:10px; font-size:0.8rem;"></div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="page-login" class="page">
        <div class="container" style="max-width:320px; margin:40px auto; background:white; padding:30px; border-radius:20px; text-align:center;">
            <h3>Admin</h3>
            <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="password" id="loginPassword" placeholder="Mot de passe" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <button class="btn btn-gold" style="width:100%" onclick="doLogin()">OK</button>
        </div>
    </div>

    <!-- MODALE JOUEUR -->
    <div class="modal-overlay" id="modal-joueur">
        <div class="modal">
            <button onclick="closeModal('joueur')" style="float:right; border:none; background:none; font-weight:bold;">X</button>
            <h3>Fiche Joueur</h3>
            <input type="hidden" id="joueurId">
            <input type="text" id="joueurPrenom" placeholder="Prénom" style="width:100%; margin:5px 0; padding:8px;">
            <input type="text" id="joueurNom" placeholder="Nom" style="width:100%; margin:5px 0; padding:8px;">
            <input type="number" id="joueurNumero" placeholder="Numéro" style="width:100%; margin:5px 0; padding:8px;">
            <select id="joueurPoste" style="width:100%; margin:5px 0; padding:8px;"><option value="Meneur">Meneur</option><option value="Arrière">Arrière</option><option value="Ailier">Ailier</option><option value="Ailier Fort">Ailier Fort</option><option value="Pivot">Pivot</option></select>
            <input type="text" id="joueurPhoto" placeholder="Photo URL" style="width:100%; margin:5px 0; padding:8px;">
            <button class="btn btn-gold" style="width:100%; margin-top:10px" onclick="saveJoueur()">Enregistrer</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false;

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
            }
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            if(id==='effectif') loadEff();
            if(id==='calendrier') loadCal();
            if(id==='stats') loadStats();
            window.scrollTo(0,0);
        }

        function loadEff() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => {
                    const j = doc.data();
                    return `<div class="player-card">
                        <div class="player-num-panini">${j.numero || '0'}</div>
                        <div class="player-img-container"><img src="${j.photo || 'logo-alcf.png'}" class="player-img"></div>
                        <div class="player-info-banner"><h4>${j.prenom} ${j.nom}</h4></div>
                        <div class="admin-only" style="position:absolute; bottom:20px; right:5px; display:flex; gap:5px;">
                            <button onclick="event.stopPropagation(); editJoueur('${doc.id}')">✏️</button>
                            <button onclick="event.stopPropagation(); deleteDoc('joueurs','${doc.id}')">🗑️</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        function loadCal() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            ['L','M','M','J','V','S','D'].forEach(d => grid.innerHTML += `<div class="calendar-day-head">${d}</div>`);
            for(let i=1; i<=31; i++) grid.innerHTML += `<div class="calendar-day"><strong>${i}</strong></div>`;
        }

        function loadStats() {
            db.collection('statsIndiv').orderBy('totalPts','desc').onSnapshot(s => {
                document.getElementById('statsIndivBody').innerHTML = s.docs.map(d => `<div style="border-bottom:1px solid #eee; padding:5px;"><strong>${d.data().joueurNom}</strong>: ${d.data().totalPts} pts</div>`).join('');
            });
        }

        async function saveJoueur() {
            const id = document.getElementById('joueurId').value, data = { prenom: document.getElementById('joueurPrenom').value, nom: document.getElementById('joueurNom').value, numero: parseInt(document.getElementById('joueurNumero').value), poste: document.getElementById('joueurPoste').value, photo: document.getElementById('joueurPhoto').value };
            if(id) await db.collection('joueurs').doc(id).update(data); else await db.collection('joueurs').add(data);
            closeModal('joueur');
        }

        async function editJoueur(id) {
            const d = (await db.collection('joueurs').doc(id).get()).data();
            document.getElementById('joueurId').value = id;
            document.getElementById('joueurPrenom').value = d.prenom;
            document.getElementById('joueurNom').value = d.nom;
            document.getElementById('joueurNumero').value = d.numero;
            document.getElementById('joueurPoste').value = d.poste;
            document.getElementById('joueurPhoto').value = d.photo;
            openModal('joueur');
        }

        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); }
        async function deleteDoc(c,i) { if(confirm('Supprimer?')) await db.collection(c).doc(i).delete(); }
        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        showPage('accueil');
    </script>
</body>
</html>
