<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; overflow-x: hidden; }

        /* NAVBAR */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 10px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; cursor: pointer; }
        .nav-logo img { height: 60px; }
        .nav-logo span { font-size: 1.8rem; font-weight: 800; color: #ffd700; margin-left: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 12px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold-light); background: rgba(255,255,255,0.1); }
        .user-info { color: var(--gold-light); margin: 0 10px; font-weight: bold; }

        /* PAGES */
        .page { display: none; width: 100%; min-height: 92vh; background: var(--gray-light); }
        .page.active { display: block !important; }
        #page-accueil { background: var(--violet); }

        /* HERO ACCUEIL (PC) */
        .hero { color: white; padding: 60px 4%; display: flex; align-items: center; min-height: 85vh; }
        .hero-content { display: grid; grid-template-columns: 350px 1fr 500px; gap: 40px; max-width: 1700px; margin: 0 auto; align-items: center; width: 100%; }
        .hero-logo { width: 100%; max-width: 320px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6)); }
        .hero-text { text-align: center; }
        .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; font-weight: 900; }
        .hero-btns { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .hero-team-img { width: 100%; max-width: 500px; border: 6px solid var(--gold); border-radius: 20px; }

        /* CHAMPIONNAT */
        .iframe-wrapper { position: relative; width: 100%; height: 800px; border-radius: 15px; overflow: hidden; background: white; }
        #ffbbIframe { position: absolute; top: -260px; left: -10px; width: 120%; height: 1200px; border: none; }

        /* EFFECTIF (TERRAIN + PANINI) */
        #page-effectif { background: #d2b48c url('https://www.transparenttextures.com/patterns/wood-pattern.png') fixed; }
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px; }
        .player-card { background: white; border: 5px solid white; border-radius: 10px; box-shadow: 0 8px 15px rgba(0,0,0,0.3); position: relative; cursor: pointer; transition: 0.3s; overflow: hidden; border-bottom: 20px solid white; }
        .player-card:hover { transform: translateY(-5px); }
        .player-img-container { width: 100%; height: 260px; overflow: hidden; border: 2px solid var(--gold); }
        .player-img { width: 100%; height: 100%; object-fit: cover; object-position: center 10%; }
        .player-num-panini { position: absolute; top: 8px; left: 8px; background: var(--gold); color: var(--violet); width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 2px solid white; z-index: 5; }
        .player-info-banner { background: var(--violet); color: var(--gold-light); padding: 8px; text-align: center; }

        /* CALENDRIER */
        .calendar-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--gray); gap: 1px; border-radius: 15px; overflow: hidden; }
        .calendar-day { background: white; min-height: 110px; padding: 10px; cursor: pointer; }
        .calendar-day-head { background: var(--violet); color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 0.75rem; }
        .event-item { font-size: 0.7rem; padding: 4px; border-radius: 4px; margin-bottom: 2px; color: white; font-weight: bold; width: 100%; text-align: left; }
        .event-match { background: var(--violet); border-left: 3px solid var(--gold); }
        .event-entrainement { background: #3498db; }

        /* CONTAINERS & BOUTONS */
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn { padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; text-decoration: none; display: inline-block; font-size: 0.9rem; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 24px; padding: 30px; max-width: 550px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 20px; right: 20px; border: none; background: #eee; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-weight: bold; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 15px; }

        /* MOBILE FIXES */
        @media (max-width: 990px) {
            .hero-content { grid-template-columns: 1fr; text-align: center; }
            .hero-logo { width: 180px; }
            .hero h1 { font-size: 2.2rem; }
            .nav-menu { overflow-x: auto; padding: 10px 0; }
            .nav-menu a { padding: 6px 10px; font-size: 0.8rem; }
            .nav-logo span { font-size: 1.2rem; }
            .players-grid { grid-template-columns: repeat(2, 1fr); }
            .calendar-day { min-height: 70px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="nav-menu" id="navLinks">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Calendrier</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Champ.</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Equipe</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('galerie')" id="nav-galerie">Galerie</a>
            <a onclick="showPage('infos')" id="nav-infos">Infos</a>
            <a onclick="showPage('messagerie')" id="nav-messagerie">Messages</a>
            <a class="btn btn-gold" style="padding:6px 12px; font-size:0.7rem; margin-left:10px;" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn" style="padding:6px 12px; font-size:0.7rem; background:var(--danger); color:white; display:none;" onclick="doLogout()" id="btnLogout">Sortir</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <section class="hero">
            <div class="hero-content">
                <img src="logo-alcf.png" class="hero-logo">
                <div class="hero-text">
                    <h1>ALCF PNM<br>BASKET-BALL</h1>
                    <div class="hero-btns">
                        <button onclick="showPage('effectif')" class="btn" style="border:2px solid var(--gold); color:white; background:transparent;">EFFECTIF</button>
                        <button onclick="showPage('championnat')" class="btn btn-gold">CLASSEMENT</button>
                    </div>
                </div>
                <img src="equipe-2025-2026.png" class="hero-team-img">
            </div>
        </section>
    </div>

    <!-- CHAMPIONNAT -->
    <div id="page-championnat" class="page">
        <div class="container" style="max-width:100%"><div class="iframe-wrapper"><iframe id="ffbbIframe" src="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=1"></iframe></div></div>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page">
        <div class="container">
            <div class="page-header"><h2>👥 Effectif PNM</h2><button class="btn btn-gold admin-only" onclick="openModal('joueur')">+ Joueur</button></div>
            <div class="players-grid" id="effectifGrid"></div>
        </div>
    </div>

    <!-- CALENDRIER -->
    <div id="page-calendrier" class="page">
        <div class="container">
            <div class="page-header"><h2>📅 Calendrier interactif</h2><button class="btn btn-gold admin-only" onclick="openModal('match')">+ Événement</button></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- STATS -->
    <div id="page-stats" class="page">
        <div class="container">
            <div class="page-header"><h2>📈 Statistiques PNM</h2><button class="btn btn-gold admin-only" onclick="openModal('statsIndiv')">+ Stats</button></div>
            <div class="table-responsive"><table class="data-table"><thead><tr><th>Joueur</th><th>3pt</th><th>2pt</th><th>LF</th><th>Total</th><th class="admin-only">X</th></tr></thead><tbody id="statsBody"></tbody></table></div>
        </div>
    </div>

    <!-- GALERIE -->
    <div id="page-galerie" class="page"><div class="container"><div class="page-header"><h2>📸 Galerie</h2><button class="btn btn-gold admin-only" onclick="openModal('galerie')">+ Photo</button></div><div class="players-grid" id="galleryGrid"></div></div></div>
    
    <!-- INFOS -->
    <div id="page-infos" class="page"><div class="container"><div class="page-header"><h2>📌 Infos Club</h2><button class="btn btn-gold admin-only" onclick="openModal('info')">+ Info</button></div><div id="infosGrid" class="players-grid"></div></div></div>

    <!-- MESSAGERIE -->
    <div id="page-messagerie" class="page"><div class="container"><h2>💬 Messagerie</h2><div id="messagesContainer"></div></div></div>

    <!-- LOGIN -->
    <div id="page-login" class="page"><div class="container" style="max-width:320px; margin:auto;"><div style="background:white; padding:40px; border-radius:20px; text-align:center;"><h3>Connexion</h3><input type="email" id="loginEmail" style="width:100%; margin:10px 0; padding:10px;"><input type="password" id="loginPassword" style="width:100%; margin:10px 0; padding:10px;"><button class="btn btn-gold" style="width:100%" onclick="doLogin()">OK</button></div></div></div>

    <!-- MODALES ADMIN -->
    <div class="modal-overlay" id="modal-joueur"><div class="modal"><button class="modal-close" onclick="closeModal('joueur')">×</button><h3>Joueur</h3><input type="hidden" id="joueurId"><div class="form-grid"><input type="text" id="joueurPrenom" placeholder="Prénom"><input type="text" id="joueurNom" placeholder="Nom"><input type="number" id="joueurNumero" placeholder="N° Maillot"><select id="joueurPoste"><option value="Meneur">Meneur</option><option value="Arrière">Arrière</option><option value="Ailier">Ailier</option><option value="Ailier Fort">Ailier Fort</option><option value="Pivot">Pivot</option></select><input type="text" id="joueurPhoto" placeholder="Photo URL" class="full-width"></div><button class="btn btn-gold" style="width:100%; margin-top:20px" onclick="saveJoueur()">Enregistrer</button></div></div>
    <div class="modal-overlay" id="modal-match"><div class="modal"><button class="modal-close" onclick="closeModal('match')">×</button><h3>Match / Entraînement</h3><div class="form-grid"><input type="date" id="matchDate"><input type="time" id="matchHeure"><input type="text" id="matchAdv" placeholder="Titre" class="full-width"></div><button class="btn btn-gold" style="width:100%; margin-top:20px" onclick="saveMatch()">Sauver</button></div></div>
    <div class="modal-overlay" id="modal-statsIndiv"><div class="modal"><button class="modal-close" onclick="closeModal('statsIndiv')">×</button><h3>Stats</h3><select id="stJoueur" style="width:100%; padding:10px;"></select><div class="form-grid"><input type="number" id="st3" placeholder="3pt"><input type="number" id="st2" placeholder="2pt"><input type="number" id="st1" placeholder="LF"></div><button class="btn btn-gold" style="width:100%; margin-top:20px" onclick="saveStats()">Sauver</button></div></div>
    <div class="modal-overlay" id="modal-info"><div class="modal"><button class="modal-close" onclick="closeModal('info')">×</button><h3>Info</h3><input type="text" id="infoTitre" style="width:100%; margin-bottom:10px;"><textarea id="infoTexte" style="width:100%; height:100px;"></textarea><button class="btn btn-gold" style="width:100%" onclick="saveInfo()">Publier</button></div></div>
    <div class="modal-overlay" id="modal-galerie"><div class="modal"><button class="modal-close" onclick="closeModal('galerie')">×</button><h3>Photo</h3><input type="text" id="galUrl" style="width:100%; margin-bottom:10px;"><button class="btn btn-gold" style="width:100%" onclick="savePhoto()">Ajouter</button></div></div>
    <div class="modal-overlay" id="modal-player-details"><div class="modal"><button class="modal-close" onclick="closeModal('player-details')">×</button><div id="detContent"></div></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false;

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
                if(document.getElementById('page-login').classList.contains('active')) showPage('accueil');
            }
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('active');
            if(id==='effectif') loadEff();
            if(id==='calendrier') loadCal();
            if(id==='stats') loadStats();
            if(id==='infos') loadInf();
            if(id==='galerie') loadGallery();
            window.scrollTo(0,0);
        }

        function loadEff() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => {
                    const j = doc.data();
                    return `<div class="player-card" onclick="openPlayer('${doc.id}')">
                        <div class="player-num-panini">${j.numero || '0'}</div>
                        <div class="player-img-container"><img src="${j.photo || 'logo-alcf.png'}" class="player-img"></div>
                        <div class="player-info-banner"><h4>${j.prenom} ${j.nom}</h4><p>${j.poste}</p></div>
                        <div class="admin-only" style="position:absolute; bottom:30px; right:10px; display:flex; gap:5px; z-index:20;">
                            <button onclick="event.stopPropagation(); editJoueur('${doc.id}')">✏️</button>
                            <button onclick="event.stopPropagation(); deleteDoc('joueurs','${doc.id}')">🗑️</button>
                        </div>
                    </div>`;
                }).join('');
            });
        }

        async function openPlayer(id) {
            const d = (await db.collection('joueurs').doc(id).get()).data();
            document.getElementById('detContent').innerHTML = `
                <div style="display:flex; align-items:center; gap:20px;">
                    <img src="${d.photo || 'logo-alcf.png'}" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid var(--gold);">
                    <div style="text-align:left">
                        <h3 style="margin:0">${d.prenom} ${d.nom}</h3>
                        <p style="color:var(--gold); font-weight:bold;">${d.poste} - Maillot n° ${d.numero}</p>
                    </div>
                </div>`;
            openModal('player-details');
        }

        function loadCal() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(d => grid.innerHTML += `<div class="calendar-day-head">${d}</div>`);
            db.collection('matchs').onSnapshot(snap => {
                for(let i=1; i<=31; i++) {
                    let evs = snap.docs.filter(d => d.data().date && d.data().date.endsWith('-'+String(i).padStart(2,'0'))).map(d => `<div class="event-item event-match">${d.data().heure} ${d.data().matchAdv||''}</div>`).join('');
                    grid.innerHTML += `<div class="calendar-day"><strong>${i}</strong>${evs}</div>`;
                }
            });
        }

        function loadStats() {
            db.collection('statsIndiv').onSnapshot(s => { document.getElementById('statsBody').innerHTML = s.docs.map(d => `<tr><td>${d.data().joueurNom}</td><td>${d.data().pts3}</td><td>${d.data().pts2}</td><td>${d.data().pts1}</td><td>${d.data().totalPts}</td><td><button onclick="deleteDoc('statsIndiv','${d.id}')">🗑️</button></td></tr>`).join(''); });
            db.collection('joueurs').get().then(s => { document.getElementById('stJoueur').innerHTML = s.docs.map(d => `<option value="${d.data().prenom} ${d.data().nom}">${d.data().prenom} ${d.data().nom}</option>`).join(''); });
        }

        function loadInf() { db.collection('infos').onSnapshot(s => { document.getElementById('infosGrid').innerHTML = s.docs.map(d => `<div class="player-card" style="text-align:left; padding:15px;"><h4>${d.data().titre}</h4><p>${d.data().texte}</p><button class="admin-only" onclick="deleteDoc('infos','${d.id}')">🗑️</button></div>`).join(''); }); }
        function loadGallery() { db.collection('photos').onSnapshot(s => { document.getElementById('galleryGrid').innerHTML = s.docs.map(d => `<div class="gallery-item"><img src="${d.data().url}" style="width:100%; height:100%; object-fit:cover;"><button class="admin-only" style="position:absolute; top:5px; right:5px;" onclick="deleteDoc('photos','${d.id}')">🗑️</button></div>`).join(''); }); }

        async function saveJoueur() { const id = document.getElementById('joueurId').value, data = { prenom: document.getElementById('joueurPrenom').value, nom: document.getElementById('joueurNom').value, numero: parseInt(document.getElementById('joueurNumero').value), poste: document.getElementById('joueurPoste').value, photo: document.getElementById('joueurPhoto').value }; if(id) await db.collection('joueurs').doc(id).update(data); else await db.collection('joueurs').add(data); closeModal('joueur'); }
        async function saveMatch() { await db.collection('matchs').add({date:document.getElementById('matchDate').value, heure:document.getElementById('matchHeure').value, matchAdv:document.getElementById('matchAdv').value}); closeModal('match'); }
        async function saveStats() { const p3=parseInt(document.getElementById('st3').value)||0, p2=parseInt(document.getElementById('st2').value)||0, p1=parseInt(document.getElementById('st1').value)||0; await db.collection('statsIndiv').add({joueurNom:document.getElementById('stJoueur').value, pts3:p3, pts2:p2, pts1:p1, totalPts:(p3*3)+(p2*2)+p1, matchs:parseInt(document.getElementById('stMJ').value)||1}); closeModal('statsIndiv'); }
        async function saveInfo() { await db.collection('infos').add({titre:document.getElementById('infoTitre').value, texte:document.getElementById('infoTexte').value}); closeModal('info'); }
        async function savePhoto() { await db.collection('photos').add({url: document.getElementById('galUrl').value}); closeModal('galerie'); }

        async function editJoueur(id) { const d = (await db.collection('joueurs').doc(id).get()).data(); document.getElementById('joueurId').value = id; document.getElementById('joueurPrenom').value = d.prenom; document.getElementById('joueurNom').value = d.nom; document.getElementById('joueurNumero').value = d.numero; document.getElementById('joueurPoste').value = d.poste; document.getElementById('joueurPhoto').value = d.photo; openModal('joueur'); }
        async function deleteDoc(c,i) { if(confirm('Supprimer?')) await db.collection(c).doc(i).delete(); }
        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); if(id==='joueur') document.getElementById('joueurId').value=''; }
        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        showPage('accueil');
    </script>
</body>
</html>
