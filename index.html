<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; overflow-x: hidden; }

        /* NAVBAR */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 72px; }
        .nav-logo span { font-size: 2.2rem; font-weight: 800; color: #ffd700; margin-left: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold-light); background: rgba(255,255,255,0.1); }
        .user-info { color: var(--gold-light); margin: 0 15px; font-weight: bold; }

        /* PAGE SYSTEM */
        .page { display: none; width: 100%; min-height: 90vh; background: var(--gray-light); }
        .page.active { display: block !important; }
        #page-accueil { background: var(--violet); }

        /* CHAMPIONNAT (RECADRAGE PRO SANS COOKIES) */
        .iframe-container-wrapper { 
            position: relative; 
            width: 100%; 
            height: 800px; /* Hauteur de ta zone de vision */
            border-radius: 15px; 
            overflow: hidden; /* C'est ça qui coupe ce qui dépasse */
            background: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        #ffbbIframe { 
            position: absolute;
            top: -260px;   /* Cache le menu du haut */
            left: -10px;   /* Ajustement léger à gauche */
            width: 120%;  /* ON ELARGIT L'IFRAME POUR POUSSER LES COOKIES HORS CHAMP */
            height: 1200px; 
            border: none; 
        }

        .journee-selector { background: var(--violet); color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; justify-content: center; }
        .journee-selector select { padding: 8px 15px; border-radius: 8px; border: none; font-weight: bold; color: var(--violet); cursor: pointer; }

        /* GRID & TABLES GÉNERAL */
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .page-header h2 { color: var(--violet); font-size: 2.2rem; border-bottom: 4px solid var(--gold); padding-bottom: 5px; }

        /* HERO ACCUEIL */
        .hero { background: linear-gradient(135deg, var(--violet), #4a1a6b); color: white; padding: 60px 4%; min-height: 85vh; display: flex; align-items: center; }
        .hero-content { display: grid; grid-template-columns: 350px 1fr 500px; gap: 40px; max-width: 1700px; margin: 0 auto; align-items: center; width: 100%; }
        .hero-logo { width: 100%; max-width: 340px; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6)); }
        .hero-text { text-align: center; }
        .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; font-weight: 900; }
        .hero .subtitle { color: var(--gold-light); font-size: 1.8rem; margin-bottom: 35px; font-weight: 600; }
        .hero-btns { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .hero-team-img { width: 100%; max-width: 500px; border: 6px solid var(--gold); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .btn { padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .btn-outline { background: transparent; border: 2px solid var(--gold); color: white; }

        /* CALENDRIER INTERACTIF */
        .calendar-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--gray); gap: 1px; border-radius: 15px; overflow: hidden; }
        .calendar-day-head { background: var(--violet); color: white; padding: 12px; text-align: center; font-weight: bold; font-size: 0.75rem; }
        .calendar-day { background: white; min-height: 120px; padding: 10px; cursor: pointer; }
        .calendar-day.today { background: #fff8e1; border: 2px solid var(--gold); }
        .event-item { font-size: 0.7rem; padding: 4px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: bold; color: white; border: none; width: 100%; text-align: left; }
        .event-match { background: var(--violet); border-left: 3px solid var(--gold); }

        /* EFFECTIF & GALERIE */
        .players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .player-card { background: white; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.06); transition: 0.3s; cursor: pointer; }
        .player-img { width: 155px; height: 155px; border-radius: 50%; border: 4px solid var(--gold); object-fit: cover; object-position: center 10%; margin: 0 auto 15px; display: block; }
        
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="nav-menu">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Calendrier</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Championnat</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Effectif</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('galerie')" id="nav-galerie">Galerie</a>
            <a onclick="showPage('infos')" id="nav-infos">Infos</a>
            <span class="user-info" id="userInfo" style="display:none"></span>
            <a class="btn btn-gold" style="padding:8px 15px; font-size:0.8rem;" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn" style="padding:8px 15px; font-size:0.8rem; background:var(--danger); color:white; display:none;" onclick="doLogout()" id="btnLogout">Sortir</a>
        </div>
    </nav>

    <!-- ACCUEIL -->
    <div id="page-accueil" class="page active">
        <section class="hero">
            <div class="hero-content">
                <img src="logo-alcf.png" class="hero-logo">
                <div class="hero-text">
                    <h1>BIENVENUE CHEZ<br>LES VIOLETS</h1>
                    <p class="subtitle">Espace officiel ALCF Basket - PNM</p>
                    <div class="hero-btns">
                        <button onclick="showPage('effectif')" class="btn btn-outline">VOIR L'EFFECTIF</button>
                        <button onclick="showPage('championnat')" class="btn btn-gold">CHAMPIONNAT</button>
                    </div>
                </div>
                <img src="equipe-2025-2026.png" class="hero-team-img">
            </div>
        </section>
    </div>

    <!-- CHAMPIONNAT (OPTIMISÉ SANS COOKIES VISIBLES) -->
    <div id="page-championnat" class="page">
        <div class="container" style="max-width: 100%;">
            <div class="journee-selector">
                <label>📅 Sélectionner la journée :</label>
                <select id="selectJournee" onchange="updateIframeJournee()"></select>
            </div>
            <div class="iframe-container-wrapper">
                <iframe id="ffbbIframe" src="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=1"></iframe>
            </div>
        </div>
    </div>

    <!-- CALENDRIER -->
    <div id="page-calendrier" class="page">
        <div class="container">
            <div class="page-header"><h2>📅 Calendrier interactif</h2></div>
            <div class="calendar-nav"><button class="btn btn-gold" onclick="changeMonth(-1)">◀</button><h3 id="calendarMonthTitle" style="min-width:220px; text-align:center;">-</h3><button class="btn btn-gold" onclick="changeMonth(1)">▶</button></div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- EFFECTIF -->
    <div id="page-effectif" class="page"><div class="container"><div class="page-header"><h2>👥 Effectif PNM</h2></div><div class="players-grid" id="effectifGrid"></div></div></div>
    
    <!-- STATS / INFOS / GALERIE / LOGIN (Stubs) -->
    <div id="page-stats" class="page"><div class="container"><h2>📈 Stats</h2></div></div>
    <div id="page-infos" class="page"><div class="container"><h2>📌 Infos</h2></div></div>
    <div id="page-galerie" class="page"><div class="container"><h2>📸 Galerie</h2></div></div>
    <div id="page-login" class="page"><div class="container" style="max-width:400px;margin:auto;text-align:center;"><h2>Connexion</h2><input type="email" id="loginEmail" style="width:100%;padding:10px;margin:10px 0;"><input type="password" id="loginPassword" style="width:100%;padding:10px;margin:10px 0;"><button class="btn btn-gold" onclick="doLogin()">OK</button></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false, currentViewDate = new Date();

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('userInfo').style.display='inline';
                document.getElementById('userInfo').textContent = '👤 ' + u.email.split('@')[0];
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
                if(document.getElementById('page-login').classList.contains('active')) showPage('accueil');
            }
        });

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-menu a').forEach(a => a.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            if(document.getElementById('nav-'+id)) document.getElementById('nav-'+id).classList.add('active');
            if(id==='championnat') initChampionnat();
            if(id==='effectif') loadEff();
            window.scrollTo(0,0);
        }

        function initChampionnat() {
            const s = document.getElementById('selectJournee');
            if(s.options.length===0) for(let i=1; i<=26; i++) { let o = document.createElement('option'); o.value=i; o.innerHTML="Journée "+i; s.appendChild(o); }
        }
        function updateIframeJournee() { document.getElementById('ffbbIframe').src = `https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577&journee=${document.getElementById('selectJournee').value}`; }

        function loadEff() {
            db.collection('joueurs').orderBy('numero').onSnapshot(snap => {
                document.getElementById('effectifGrid').innerHTML = snap.docs.map(doc => `<div class="player-card"><img src="${doc.data().photo || 'logo-alcf.png'}" class="player-img"><h4>${doc.data().prenom} ${doc.data().nom}</h4><p>${doc.data().poste}</p></div>`).join('');
            });
        }

        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        showPage('accueil');
    </script>
</body>
</html>
