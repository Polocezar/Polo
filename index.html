<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL Chazeau Fayol Basket - PNM</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root {
            --violet: #2d1048; --violet-light: #4a1a6b; --gold: #f5a623; --gold-light: #ffd700;
            --white: #ffffff; --gray-light: #f5f5f5; --gray: #e0e0e0; --gray-dark: #666;
            --danger: #e74c3c; --success: #27ae60;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--gray-light); color: #111827; }

        /* NAVBAR */
        .navbar { background: linear-gradient(135deg, var(--violet), #4a1a6b); padding: 15px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .nav-logo { display: flex; align-items: center; text-decoration: none; }
        .nav-logo img { height: 72px; }
        .nav-logo span { font-size: 2.2rem; font-weight: 800; color: #ffd700; margin-left: 14px; }
        .nav-menu { display: flex; align-items: center; gap: 5px; }
        .nav-menu a { color: white; text-decoration: none; padding: 8px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
        .nav-menu a:hover, .nav-menu a.active { color: var(--gold-light); background: rgba(255,255,255,0.1); }

        /* GESTION DES PAGES */
        .page { display: none; width: 100%; min-height: 90vh; }
        .page.active { display: block !important; }
        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }

        /* CHAMPIONNAT PAGE */
        .comp-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 30px; }
        .section-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        /* MATCHS JOURNÉE */
        .journee-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--violet); color: white; padding: 10px 20px; border-radius: 12px; }
        .match-row { display: grid; grid-template-columns: 1fr 40px 20px 40px 1fr; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--gray-light); text-align: center; font-size: 0.95rem; }
        .match-row span { font-weight: bold; color: var(--violet); }
        .score-box { background: #eee; padding: 5px; border-radius: 5px; font-weight: 900; width: 35px; }
        .score-box.win { background: var(--gold); color: var(--violet); }

        /* TABLEAU CLASSEMENT */
        .ranking-table { width: 100%; border-collapse: collapse; }
        .ranking-table th { font-size: 0.75rem; color: var(--gray-dark); text-transform: uppercase; padding: 10px; border-bottom: 2px solid var(--gray-light); text-align: left; }
        .ranking-table td { padding: 12px 10px; border-bottom: 1px solid var(--gray-light); font-size: 0.9rem; }
        .row-me { background: #fdf6ec !important; font-weight: 800; border-left: 4px solid var(--gold); }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 24px; padding: 35px; max-width: 500px; width: 100%; position: relative; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--violet); }
        .form-group input { width: 100%; padding: 10px; border: 2px solid var(--gray); border-radius: 10px; }

        .btn { padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; text-transform: uppercase; }
        .btn-gold { background: var(--gold); color: var(--violet); }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: inline-flex !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-logo" onclick="showPage('accueil')">
            <img src="logo-alcf.png" alt="Logo">
            <span>ALCF Basket</span>
        </a>
        <div class="nav-menu">
            <a onclick="showPage('accueil')" id="nav-accueil">Accueil</a>
            <a onclick="showPage('calendrier')" id="nav-calendrier">Mon Calendrier</a>
            <a onclick="showPage('championnat')" id="nav-championnat">Championnat</a>
            <a onclick="showPage('effectif')" id="nav-effectif">Effectif</a>
            <a onclick="showPage('stats')" id="nav-stats">Stats</a>
            <a onclick="showPage('galerie')" id="nav-galerie">Galerie</a>
            <a onclick="showPage('messagerie')" id="nav-messagerie">Messages</a>
            <a class="btn btn-gold" style="padding:8px 15px; font-size:0.7rem;" onclick="showPage('login')" id="btnLogin">Connexion</a>
            <a class="btn" style="padding:8px 15px; font-size:0.7rem; background:var(--danger); color:white; display:none;" onclick="doLogout()" id="btnLogout">Sortir</a>
        </div>
    </nav>

    <!-- PAGE CHAMPIONNAT (RESULTATS POULE + CLASSEMENT) -->
    <div id="page-championnat" class="page">
        <div class="container">
            <div class="page-header">
                <h2>🏆 Championnat PNM - Poule A</h2>
                <a href="https://competitions.ffbb.com/ligues/ara/competitions/pnm?phase=200000002872829&poule=200000003018577" target="_blank" class="btn btn-gold" style="font-size:0.7rem;">Site Officiel FFBB ↗</a>
            </div>

            <div class="comp-grid">
                <!-- Résultats de la journée -->
                <div class="section-card">
                    <div class="journee-nav">
                        <button style="background:none; border:none; color:white; cursor:pointer;" onclick="changeJournee(-1)">◀</button>
                        <span id="journeeTitle" style="font-weight:bold; font-size:1.1rem;">Journée 1</span>
                        <button style="background:none; border:none; color:white; cursor:pointer;" onclick="changeJournee(1)">▶</button>
                    </div>
                    <div class="admin-only" style="margin-bottom:15px; width:100%">
                        <button class="btn btn-gold" style="width:100%;" onclick="openModal('match-championnat')">+ Ajouter un match à la journée</button>
                    </div>
                    <div id="matchsJourneeList">
                        <!-- Liste des matchs de la poule -->
                    </div>
                </div>

                <!-- Classement -->
                <div class="section-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3 style="color:var(--violet)">Classement Officiel</h3>
                        <button class="btn btn-gold admin-only" style="padding:5px 12px; font-size:0.7rem;" onclick="openModal('classement')">Editer</button>
                    </div>
                    <table class="ranking-table">
                        <thead><tr><th>Pos</th><th>Équipe</th><th>V</th><th>D</th><th>Pts</th></tr></thead>
                        <tbody id="rankingBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODALE CLASSEMENT -->
    <div class="modal-overlay" id="modal-classement">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('classement')">×</button>
            <h3>Mettre à jour le classement</h3>
            <div class="form-group"><label>Nom de l'équipe</label><input type="text" id="rankEquipe" placeholder="Ex: MANTAILLE"></div>
            <div class="form-group"><label>Position</label><input type="number" id="rankPos"></div>
            <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="form-group"><label>Victoires</label><input type="number" id="rankV"></div>
                <div class="form-group"><label>Défaites</label><input type="number" id="rankD"></div>
            </div>
            <div class="form-group"><label>Points</label><input type="number" id="rankPts"></div>
            <button class="btn btn-gold" style="width:100%" onclick="saveRanking()">Enregistrer l'équipe</button>
        </div>
    </div>

    <!-- MODALE MATCH CHAMPIONNAT -->
    <div class="modal-overlay" id="modal-match-championnat">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('match-championnat')">×</button>
            <h3>Match de la poule</h3>
            <div class="form-group"><label>Journée</label><input type="number" id="matchJ" value="1"></div>
            <div class="form-group"><label>Équipe Domicile</label><input type="text" id="matchDom"></div>
            <div class="form-group"><label>Équipe Extérieur</label><input type="text" id="matchExt"></div>
            <div class="form-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="form-group"><label>Score Dom</label><input type="number" id="scoreDom"></div>
                <div class="form-group"><label>Score Ext</label><input type="number" id="scoreExt"></div>
            </div>
            <button class="btn btn-gold" style="width:100%" onclick="saveMatchChampionnat()">Enregistrer</button>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="page-login" class="page"><div class="container" style="max-width:400px;margin:auto;"><div class="section-card"><h2>Connexion Admin</h2><input type="email" id="loginEmail" placeholder="Email" style="width:100%;padding:12px;margin:10px 0;"><input type="password" id="loginPassword" placeholder="Pass" style="width:100%;padding:12px;margin:10px 0;"><button class="btn btn-gold" style="width:100%" onclick="doLogin()">OK</button></div></div></div>

    <!-- PAGES VIDES POUR LE MOMENT -->
    <div id="page-accueil" class="page active"></div>
    <div id="page-calendrier" class="page"><div class="container"><h2>Mon Calendrier</h2><div id="calendarGrid"></div></div></div>
    <div id="page-effectif" class="page"></div><div id="page-stats" class="page"></div><div id="page-galerie" class="page"></div><div id="page-messagerie" class="page"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYZuhh6iKsUMM-MBA3fANDGgCQOhANfVU",
            authDomain: "alcf-basket.firebaseapp.com",
            projectId: "alcf-basket",
            storageBucket: "alcf-basket.firebasestorage.app",
            messagingSenderId: "1082312491425",
            appId: "1:1082312491425:web:646f4c5158d2707b0d8be0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(), auth = firebase.auth();
        const ADMIN = "polocezar@gmail.com";
        let isAdmin = false, currentJ = 1;

        auth.onAuthStateChanged(u => {
            isAdmin = u && u.email === ADMIN;
            document.body.classList.toggle('is-admin', isAdmin);
            if(u) {
                document.getElementById('btnLogin').style.display='none';
                document.getElementById('btnLogout').style.display='inline-flex';
                if(document.getElementById('page-login').classList.contains('active')) showPage('accueil');
            }
        });

        async function doLogin() { try { await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); } catch { alert('Erreur'); } }
        function doLogout() { auth.signOut(); location.reload(); }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            if(id === 'championnat') { loadRanking(); loadJournee(); }
        }

        /* LOGIQUE CHAMPIONNAT */
        function loadRanking() {
            db.collection('pouleClassement').orderBy('pos','asc').onSnapshot(snap => {
                document.getElementById('rankingBody').innerHTML = snap.docs.map(doc => {
                    const d = doc.data();
                    const isMe = d.nom.includes('FIRMINY') || d.nom.includes('ALCF');
                    return `<tr class="${isMe?'row-me':''}"><td>${d.pos}</td><td>${d.nom}</td><td>${d.v}</td><td>${d.d}</td><td>${d.pts}</td></tr>`;
                }).join('');
            });
        }

        function loadJournee() {
            document.getElementById('journeeTitle').textContent = `Journée ${currentJ}`;
            db.collection('pouleMatchs').where('j','==',currentJ).onSnapshot(snap => {
                if(snap.empty) { document.getElementById('matchsJourneeList').innerHTML = '<p style="text-align:center; padding:20px;">Aucun match saisi pour cette journée.</p>'; return; }
                document.getElementById('matchsJourneeList').innerHTML = snap.docs.map(doc => {
                    const m = doc.data();
                    return `<div class="match-row">
                        <div style="text-align:right">${m.dom}</div>
                        <div class="score-box ${m.sDom > m.sExt ? 'win' : ''}">${m.sDom || 0}</div>
                        <div>-</div>
                        <div class="score-box ${m.sExt > m.sDom ? 'win' : ''}">${m.sExt || 0}</div>
                        <div style="text-align:left">${m.ext}</div>
                    </div>`;
                }).join('');
            });
        }

        function changeJournee(v) { currentJ += v; if(currentJ < 1) currentJ = 1; loadJournee(); }

        async function saveRanking() {
            const data = { nom: document.getElementById('rankEquipe').value.toUpperCase(), pos: parseInt(document.getElementById('rankPos').value), v: parseInt(document.getElementById('rankV').value), d: parseInt(document.getElementById('rankD').value), pts: parseInt(document.getElementById('rankPts').value) };
            await db.collection('pouleClassement').add(data); closeModal('classement');
        }

        async function saveMatchChampionnat() {
            const data = { j: parseInt(document.getElementById('matchJ').value), dom: document.getElementById('matchDom').value, ext: document.getElementById('matchExt').value, sDom: parseInt(document.getElementById('scoreDom').value), sExt: parseInt(document.getElementById('scoreExt').value) };
            await db.collection('pouleMatchs').add(data); closeModal('match-championnat');
        }

        function openModal(id) { document.getElementById('modal-'+id).classList.add('active'); }
        function closeModal(id) { document.getElementById('modal-'+id).classList.remove('active'); }

        showPage('accueil');
    </script>
</body>
</html>
